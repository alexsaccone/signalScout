name: Publish dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard.yml
      - data/reviewed_pairs.json
      - requirements.txt
      - 'src/Arbitrage/**'
      - 'src/website/**'

permissions:
  contents: read

concurrency:
  group: signalscout-pages
  cancel-in-progress: false

jobs:
  settlement-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover pairs for settlement review
        run: |
          mkdir -p settlement-review
          python -m src.Arbitrage.ai_filter --hours 96 --review-candidates settlement-review/candidates.json --review-leads settlement-review/review-leads.json --settlement-assessment settlement-review/assessment.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: settlement-review
          path: settlement-review/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: settlement-review
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/website/package-lock.json
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        if: needs.settlement-review.result == 'success'
        with:
          name: settlement-review
          path: settlement-review
      - name: Build the market snapshot
        run: |
          if [[ -f settlement-review/assessment.json ]]; then
            python -m src.Arbitrage.dashboard --settlement-assessment settlement-review/assessment.json
          else
            python -m src.Arbitrage.dashboard
          fi
      - run: npm ci && npm test && npm run build
        working-directory: src/website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
